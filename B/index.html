<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes-B)</title>
    <link rel="icon" type="image/png" href="Tes-B.png">
    <link rel="apple-touch-icon" href="Tes-B.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <iframe id="gas-iframe" src=""></iframe>

    <script>
        // 1. Masukkan URL Web App Google Apps Script Tes B Anda di sini
        const webAppUrl = "https://script.google.com/macros/s/AKfycbx3b0rp6YpzcKwODxVReHpjZofyzEHS4ydN8Hj8N386TfNZPd6ZuG-9XO8KkswnY-UW/exec";
        
        // 2. Tangkap parameter (?token=...) dari URL tes-online.web.id
        const queryString = window.location.search;
        
        // 3. Gabungkan URL GAS dengan parameter, lalu masukkan ke iframe
        document.getElementById('gas-iframe').src = webAppUrl + queryString;
    </script>

</body>
</html>
